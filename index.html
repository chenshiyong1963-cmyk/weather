<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世界天气时钟</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #fffdf8;
    --ink: #1f2328;
    --muted: #6b6f76;
    --line: #e3ddd0;
    --accent: #c2410c;
    --accent-soft: #fde7d9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a;
      --card: #1e2125;
      --ink: #eceae6;
      --muted: #9aa0a6;
      --line: #2d3136;
      --accent: #fb923c;
      --accent-soft: #3a2518;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 680px; margin: 0 auto; padding: 28px 16px 48px; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; letter-spacing: .02em; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }

  .lang { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex-shrink: 0; }
  .lang button {
    border: 0; background: var(--card); color: var(--muted);
    padding: 6px 11px; font-size: .85rem; cursor: pointer;
  }
  .lang button + button { border-left: 1px solid var(--line); }
  .lang button.on { background: var(--accent); color: #fff; }

  .search { position: relative; }
  .search-row { display: flex; gap: 8px; }
  .go {
    flex-shrink: 0; display: flex; align-items: center; gap: 6px;
    border: 0; border-radius: 12px; padding: 0 16px;
    background: var(--accent); color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
  }
  .go:disabled { opacity: .7; cursor: default; }
  .go svg { width: 18px; height: 18px; }
  .go.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .search input {
    flex: 1; min-width: 0;
    width: 100%;
    font-size: 1.05rem;
    padding: 14px 16px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    color: var(--ink);
    outline: none;
  }
  .search input:focus { border-color: var(--accent); }
  .results {
    position: absolute; z-index: 10; left: 0; right: 0; top: calc(100% + 6px);
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    list-style: none; margin: 0; padding: 6px; display: none;
    box-shadow: 0 10px 30px rgba(0,0,0,.12);
    max-height: 320px; overflow-y: auto;
  }
  .results.show { display: block; }
  .results li { padding: 10px 12px; border-radius: 8px; cursor: pointer; }
  .results li:hover, .results li.active { background: var(--accent-soft); }
  .results .meta { color: var(--muted); font-size: .85rem; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 24px; }
  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: 6px 12px; border-radius: 999px; font-size: .9rem; cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 22px;
  }
  .place { font-size: 1.35rem; font-weight: 600; margin: 0; }
  .place-meta { color: var(--muted); font-size: .9rem; margin: 2px 0 18px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
  .block { border-top: 1px solid var(--line); padding-top: 12px; }
  .label { color: var(--muted); font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; }
  .clock { font-size: 2.4rem; font-weight: 600; font-variant-numeric: tabular-nums; margin: 2px 0 0; }
  .date { color: var(--muted); }
  .tz { font-size: 1.05rem; margin-top: 4px; word-break: break-all; }
  .diff { color: var(--accent); font-size: .9rem; }

  .now { display: flex; align-items: center; gap: 14px; margin-top: 4px; }
  .icon { font-size: 3rem; line-height: 1; }
  .temp { font-size: 2.4rem; font-weight: 600; }
  .desc { color: var(--muted); }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: .92rem; }
  .facts span b { font-weight: 600; }

  .days { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 18px; text-align: center; }
  .day { background: var(--bg); border-radius: 10px; padding: 10px 4px; font-size: .85rem; }
  .day .i { font-size: 1.4rem; }
  .day .hi { font-weight: 600; }
  .day .lo { color: var(--muted); }

  .status { color: var(--muted); text-align: center; padding: 30px 0; }
  .err { color: #dc2626; }
  footer { color: var(--muted); font-size: .8rem; margin-top: 28px; text-align: center; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1 id="t-title"></h1>
      <p class="sub" id="t-sub"></p>
    </div>
    <div class="lang" id="lang">
      <button data-l="zh">中文</button>
      <button data-l="en">EN</button>
      <button data-l="ja">日本語</button>
    </div>
  </div>

  <div class="search">
    <div class="search-row">
      <input id="q" type="search" enterkeyhint="search" autocomplete="off">
      <button id="go" class="go" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        <span id="t-go"></span>
      </button>
    </div>
    <ul id="results" class="results"></ul>
  </div>

  <div class="chips" id="chips"></div>

  <section id="out" class="card"></section>

  <footer><span id="t-src"></span><a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></footer>
</main>

<script>
// ---------- 多语言文本 ----------
const I18N = {
  zh: {
    htmlLang: "zh-CN", locale: "zh-CN",
    title: "世界天气时钟",
    sub: "搜索或选择任意城市，查看当地时区、当地时间和天气。",
    placeholder: "输入城市名，例如：东京、Paris、New York",
    src: "天气与城市数据：",
    pick: "请选择一个城市",
    localTime: "当地时间", timezone: "时区", weather: "当地天气",
    loadingWx: "正在获取天气…", wxFail: "天气获取失败：",
    searchFail: "搜索失败，请检查网络", noResult: "没有找到匹配的城市",
    sameTz: "与你所在时区相同",
    diff: (ahead, h) => `比你的时间${ahead ? "快" : "慢"} ${h}`,
    hours: (h, m) => m ? `${h} 小时 ${m} 分钟` : `${h} 小时`,
    feels: "体感", humidity: "湿度", wind: "风速", rain: "今日降水概率",
    today: "今天", sep: "，", go: "刷新",
  },
  en: {
    htmlLang: "en", locale: "en-US",
    title: "World Weather Clock",
    sub: "Search or pick any city to see its time zone, local time and weather.",
    placeholder: "Type a city, e.g. Tokyo, Paris, 北京",
    src: "Weather & city data: ",
    pick: "Pick a city",
    localTime: "Local time", timezone: "Time zone", weather: "Weather",
    loadingWx: "Loading weather…", wxFail: "Couldn't load weather: ",
    searchFail: "Search failed — check your connection", noResult: "No matching city",
    sameTz: "Same as your time zone",
    diff: (ahead, h) => `${h} ${ahead ? "ahead of" : "behind"} you`,
    hours: (h, m) => [h ? `${h} h` : "", m ? `${m} min` : ""].filter(Boolean).join(" "),
    feels: "Feels like", humidity: "Humidity", wind: "Wind", rain: "Rain chance today",
    today: "Today", sep: ", ", go: "Refresh",
  },
  ja: {
    htmlLang: "ja", locale: "ja-JP",
    title: "世界の天気と時刻",
    sub: "都市を検索または選択して、現地のタイムゾーン・現地時刻・天気を表示します。",
    placeholder: "都市名を入力（例：大阪、Paris、北京）",
    src: "天気・都市データ：",
    pick: "都市を選んでください",
    localTime: "現地時刻", timezone: "タイムゾーン", weather: "現地の天気",
    loadingWx: "天気を取得中…", wxFail: "天気を取得できませんでした：",
    searchFail: "検索に失敗しました。接続を確認してください", noResult: "該当する都市が見つかりません",
    sameTz: "あなたのタイムゾーンと同じ",
    diff: (ahead, h) => `あなたより ${h} ${ahead ? "進んでいます" : "遅れています"}`,
    hours: (h, m) => m ? `${h}時間${m}分` : `${h}時間`,
    feels: "体感", humidity: "湿度", wind: "風速", rain: "今日の降水確率",
    today: "今日", sep: "、", go: "更新",
  },
};

// 常用城市（各语言名称）
const PRESETS = [
  { n: { zh: "东京", en: "Tokyo", ja: "東京" }, c: { zh: "日本", en: "Japan", ja: "日本" }, latitude: 35.6895, longitude: 139.6917, timezone: "Asia/Tokyo" },
  { n: { zh: "北京", en: "Beijing", ja: "北京" }, c: { zh: "中国", en: "China", ja: "中国" }, latitude: 39.9075, longitude: 116.3972, timezone: "Asia/Shanghai" },
  { n: { zh: "上海", en: "Shanghai", ja: "上海" }, c: { zh: "中国", en: "China", ja: "中国" }, latitude: 31.2222, longitude: 121.4581, timezone: "Asia/Shanghai" },
  { n: { zh: "首尔", en: "Seoul", ja: "ソウル" }, c: { zh: "韩国", en: "South Korea", ja: "韓国" }, latitude: 37.5660, longitude: 126.9784, timezone: "Asia/Seoul" },
  { n: { zh: "新加坡", en: "Singapore", ja: "シンガポール" }, c: { zh: "新加坡", en: "Singapore", ja: "シンガポール" }, latitude: 1.2897, longitude: 103.8501, timezone: "Asia/Singapore" },
  { n: { zh: "伦敦", en: "London", ja: "ロンドン" }, c: { zh: "英国", en: "United Kingdom", ja: "イギリス" }, latitude: 51.5085, longitude: -0.1257, timezone: "Europe/London" },
  { n: { zh: "巴黎", en: "Paris", ja: "パリ" }, c: { zh: "法国", en: "France", ja: "フランス" }, latitude: 48.8534, longitude: 2.3488, timezone: "Europe/Paris" },
  { n: { zh: "纽约", en: "New York", ja: "ニューヨーク" }, c: { zh: "美国", en: "United States", ja: "アメリカ" }, latitude: 40.7143, longitude: -74.0060, timezone: "America/New_York" },
  { n: { zh: "洛杉矶", en: "Los Angeles", ja: "ロサンゼルス" }, c: { zh: "美国", en: "United States", ja: "アメリカ" }, latitude: 34.0522, longitude: -118.2437, timezone: "America/Los_Angeles" },
  { n: { zh: "悉尼", en: "Sydney", ja: "シドニー" }, c: { zh: "澳大利亚", en: "Australia", ja: "オーストラリア" }, latitude: -33.8679, longitude: 151.2073, timezone: "Australia/Sydney" },
];

// WMO 天气代码：[图标(白天), 图标(夜间), 中文, English, 日本語]
const WMO = {
  0: ["☀️", "🌙", "晴", "Clear", "快晴"],
  1: ["🌤️", "🌙", "大致晴朗", "Mainly clear", "晴れ"],
  2: ["⛅", "☁️", "局部多云", "Partly cloudy", "一部曇り"],
  3: ["☁️", "☁️", "阴", "Overcast", "曇り"],
  45: ["🌫️", "🌫️", "雾", "Fog", "霧"],
  48: ["🌫️", "🌫️", "冻雾", "Freezing fog", "着氷性の霧"],
  51: ["🌦️", "🌦️", "小毛毛雨", "Light drizzle", "弱い霧雨"],
  53: ["🌦️", "🌦️", "毛毛雨", "Drizzle", "霧雨"],
  55: ["🌧️", "🌧️", "大毛毛雨", "Heavy drizzle", "強い霧雨"],
  56: ["🌧️", "🌧️", "冻毛毛雨", "Freezing drizzle", "着氷性の霧雨"],
  57: ["🌧️", "🌧️", "强冻毛毛雨", "Heavy freezing drizzle", "強い着氷性の霧雨"],
  61: ["🌦️", "🌦️", "小雨", "Light rain", "小雨"],
  63: ["🌧️", "🌧️", "中雨", "Rain", "雨"],
  65: ["🌧️", "🌧️", "大雨", "Heavy rain", "大雨"],
  66: ["🌧️", "🌧️", "冻雨", "Freezing rain", "着氷性の雨"],
  67: ["🌧️", "🌧️", "强冻雨", "Heavy freezing rain", "強い着氷性の雨"],
  71: ["🌨️", "🌨️", "小雪", "Light snow", "小雪"],
  73: ["🌨️", "🌨️", "中雪", "Snow", "雪"],
  75: ["❄️", "❄️", "大雪", "Heavy snow", "大雪"],
  77: ["🌨️", "🌨️", "雪粒", "Snow grains", "霧雪"],
  80: ["🌦️", "🌦️", "小阵雨", "Light showers", "弱いにわか雨"],
  81: ["🌧️", "🌧️", "阵雨", "Showers", "にわか雨"],
  82: ["⛈️", "⛈️", "强阵雨", "Violent showers", "激しいにわか雨"],
  85: ["🌨️", "🌨️", "小阵雪", "Light snow showers", "弱いにわか雪"],
  86: ["❄️", "❄️", "大阵雪", "Heavy snow showers", "強いにわか雪"],
  95: ["⛈️", "⛈️", "雷暴", "Thunderstorm", "雷雨"],
  96: ["⛈️", "⛈️", "雷暴伴小冰雹", "Thunderstorm with hail", "雷雨（ひょう）"],
  99: ["⛈️", "⛈️", "雷暴伴大冰雹", "Thunderstorm with heavy hail", "雷雨（強いひょう）"],
};
const LANG_IDX = { zh: 2, en: 3, ja: 4 };
function wmo(code, isDay = 1) {
  const w = WMO[code];
  if (!w) return { text: "?", icon: "❔" };
  return { text: w[LANG_IDX[lang]], icon: isDay ? w[0] : w[1] };
}

// ---------- 状态 ----------
const $ = (id) => document.getElementById(id);
const out = $("out");
const input = $("q");
const list = $("results");
let lang = detectLang();
let T = I18N[lang];
let clockTimer = null, searchTimer = null, searchSeq = 0, showSeq = 0;
let current = [], activeIdx = -1;
let selected = null;        // 当前城市
let lastWeather = null;     // 当前天气数据（切换语言时重绘用）

function detectLang() {
  try {
    const saved = localStorage.getItem("wx-lang");
    if (saved && I18N[saved]) return saved;
  } catch {}
  const nav = (navigator.language || "zh").toLowerCase();
  if (nav.startsWith("ja")) return "ja";
  if (nav.startsWith("zh")) return "zh";
  return "en";
}

// ---------- 语言切换 ----------
document.querySelectorAll("#lang button").forEach((b) => {
  b.onclick = () => setLang(b.dataset.l);
});

function setLang(l) {
  lang = l; T = I18N[l];
  try { localStorage.setItem("wx-lang", l); } catch {}
  document.documentElement.lang = T.htmlLang;
  document.title = T.title;
  $("t-title").textContent = T.title;
  $("t-sub").textContent = T.sub;
  $("t-src").textContent = T.src;
  input.placeholder = T.placeholder;
  $("t-go").textContent = T.go;
  document.querySelectorAll("#lang button").forEach((b) => b.classList.toggle("on", b.dataset.l === l));
  renderChips();
  hideResults();
  if (!selected) {
    out.innerHTML = `<div class="status">${T.pick}</div>`;
  } else if (selected.preset) {
    show(selected.preset);            // 预设城市：直接用新语言的名字
  } else {
    relabelCity(selected);            // 搜索来的城市：用新语言重新查一次地名
  }
}

function renderChips() {
  const box = $("chips");
  box.innerHTML = "";
  PRESETS.forEach((p) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = p.n[lang];
    b.onclick = () => { input.value = ""; show(p); };
    box.appendChild(b);
  });
}

function presetToCity(p) {
  return { name: p.n[lang], country: p.c[lang], latitude: p.latitude, longitude: p.longitude, timezone: p.timezone, preset: p };
}

// 切换语言时，按 id 用新语言重新取城市名
async function relabelCity(city) {
  let c = city;
  try {
    if (city.id) {
      const r = await fetch(`https://geocoding-api.open-meteo.com/v1/get?id=${city.id}&language=${lang}`);
      if (r.ok) { const d = await r.json(); if (d && d.name) c = d; }
    }
  } catch {}
  show(c, true);
}

// ---------- 搜索 ----------
input.addEventListener("input", () => {
  clearTimeout(searchTimer);
  const q = input.value.trim();
  if (!q) { hideResults(); return; }
  searchTimer = setTimeout(() => search(q), 300);
});
input.addEventListener("keydown", (e) => {
  if (!list.classList.contains("show")) {
    if (e.key === "Enter") { e.preventDefault(); refresh(); }
    return;
  }
  if (e.key === "ArrowDown") { e.preventDefault(); setActive(activeIdx + 1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); setActive(activeIdx - 1); }
  else if (e.key === "Enter") { e.preventDefault(); pick(activeIdx >= 0 ? activeIdx : 0); }
  else if (e.key === "Escape") { hideResults(); }
});
document.addEventListener("click", (e) => {
  if (!e.target.closest(".search")) hideResults();
});

async function search(q) {
  const seq = ++searchSeq;
  const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=${lang}&format=json`;
  try {
    const r = await fetch(url);
    const data = await r.json();
    if (seq !== searchSeq) return;
    current = data.results || [];
    renderResults();
  } catch {
    if (seq !== searchSeq) return;
    list.innerHTML = `<li class="err">${T.searchFail}</li>`;
    list.classList.add("show");
  }
}

function renderResults() {
  activeIdx = -1;
  if (!current.length) {
    list.innerHTML = `<li class="meta">${T.noResult}</li>`;
  } else {
    list.innerHTML = current.map((c, i) => {
      const region = [c.admin1, c.country].filter(Boolean).join(T.sep);
      return `<li data-i="${i}"><div>${esc(c.name)}</div><div class="meta">${esc(region)} · ${esc(c.timezone || "")}</div></li>`;
    }).join("");
    list.querySelectorAll("li[data-i]").forEach((li) => { li.onclick = () => pick(+li.dataset.i); });
  }
  list.classList.add("show");
}
function setActive(i) {
  const items = list.querySelectorAll("li[data-i]");
  if (!items.length) return;
  activeIdx = (i + items.length) % items.length;
  items.forEach((el, k) => el.classList.toggle("active", k === activeIdx));
  items[activeIdx].scrollIntoView({ block: "nearest" });
}
function pick(i) {
  const c = current[i];
  if (!c) return;
  hideResults();
  input.value = c.name;
  show(c);
}
function hideResults() { list.classList.remove("show"); }

// ---------- 刷新按钮 ----------
// 输入框里是新城市 → 搜索并显示第一个结果；否则 → 重新获取当前城市的天气
const goBtn = $("go");
goBtn.onclick = () => refresh();

async function refresh() {
  if (goBtn.disabled) return;
  clearTimeout(searchTimer);
  const q = input.value.trim();
  goBtn.disabled = true; goBtn.classList.add("spin");
  try {
    if (q && (!selected || q !== selected.name)) {
      const seq = ++searchSeq;
      const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=${lang}&format=json`);
      const data = await r.json();
      if (seq !== searchSeq) return;
      const res = data.results || [];
      if (!res.length) { current = []; renderResults(); return; }
      hideResults();
      input.blur();
      await show(res[0], false, true);
    } else if (selected) {
      hideResults();
      input.blur();
      await show(selected.preset || selected, false, true);
    }
  } catch {
    list.innerHTML = `<li class="err">${T.searchFail}</li>`;
    list.classList.add("show");
  } finally {
    goBtn.disabled = false; goBtn.classList.remove("spin");
  }
}

// ---------- 显示城市 ----------
async function show(cityOrPreset, keepWeather = false, force = false) {
  const city = cityOrPreset.n ? presetToCity(cityOrPreset) : cityOrPreset;
  const sameCity = selected && selected.latitude === city.latitude && selected.longitude === city.longitude;
  selected = city;
  const seq = ++showSeq;
  clearInterval(clockTimer);
  const tz = city.timezone;
  const region = [city.admin1, city.country].filter(Boolean).join(T.sep);

  out.innerHTML = `
    <p class="place">${esc(city.name)}</p>
    <p class="place-meta">${esc(region)} · ${city.latitude.toFixed(2)}°, ${city.longitude.toFixed(2)}°</p>
    <div class="grid">
      <div class="block">
        <div class="label">${T.localTime}</div>
        <div class="clock" id="clock">--:--:--</div>
        <div class="date" id="date"></div>
      </div>
      <div class="block">
        <div class="label">${T.timezone}</div>
        <div class="tz">${esc(tz)}</div>
        <div class="tz" id="offset"></div>
        <div class="diff" id="diff"></div>
      </div>
    </div>
    <div class="block" style="margin-top:14px">
      <div class="label">${T.weather}</div>
      <div id="wx" class="status" style="padding:16px 0">${T.loadingWx}</div>
    </div>`;

  const tick = () => {
    const now = new Date();
    $("clock").textContent = new Intl.DateTimeFormat(T.locale, {
      timeZone: tz, hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false,
    }).format(now);
    $("date").textContent = new Intl.DateTimeFormat(T.locale, {
      timeZone: tz, year: "numeric", month: "long", day: "numeric", weekday: "long",
    }).format(now);
    const off = offsetMinutes(tz, now);
    $("offset").textContent = "UTC" + fmtOffset(off);
    const d = off - (-now.getTimezoneOffset());
    $("diff").textContent = d === 0 ? T.sameTz : T.diff(d > 0, fmtHours(Math.abs(d)));
  };
  tick();
  clockTimer = setInterval(tick, 1000);

  // 只是切换语言且天气已有 → 直接重绘，不再请求
  if (!force && (keepWeather || sameCity) && lastWeather && lastWeather.lat === city.latitude && lastWeather.lon === city.longitude) {
    renderWeather(lastWeather.data);
    return;
  }

  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.latitude}&longitude=${city.longitude}` +
      `&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m` +
      `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max` +
      `&timezone=${encodeURIComponent(tz || "auto")}&forecast_days=5`;
    const r = await fetch(url);
    const d = await r.json();
    if (!r.ok) throw new Error(d.reason || r.status);
    if (seq !== showSeq) return;
    lastWeather = { lat: city.latitude, lon: city.longitude, data: d };
    renderWeather(d);
  } catch (e) {
    if (seq !== showSeq) return;
    const wx = $("wx");
    if (wx) wx.innerHTML = `<span class="err">${T.wxFail}${esc(String(e.message || e))}</span>`;
  }
}

function renderWeather(d) {
  const wx = $("wx");
  if (!wx) return;
  const c = d.current;
  const w = wmo(c.weather_code, c.is_day);
  const days = d.daily.time.map((t, i) => {
    const dw = wmo(d.daily.weather_code[i]);
    const label = i === 0 ? T.today : new Intl.DateTimeFormat(T.locale, { weekday: "short", timeZone: "UTC" })
      .format(new Date(t + "T12:00:00Z"));
    return `<div class="day">
      <div>${label}</div>
      <div class="i" title="${esc(dw.text)}">${dw.icon}</div>
      <div class="hi">${Math.round(d.daily.temperature_2m_max[i])}°</div>
      <div class="lo">${Math.round(d.daily.temperature_2m_min[i])}°</div>
    </div>`;
  }).join("");
  const rain = d.daily.precipitation_probability_max?.[0];

  wx.outerHTML = `
    <div class="now">
      <div class="icon">${w.icon}</div>
      <div>
        <div class="temp">${Math.round(c.temperature_2m)}°C</div>
        <div class="desc">${esc(w.text)}</div>
      </div>
    </div>
    <div class="facts">
      <span>${T.feels} <b>${Math.round(c.apparent_temperature)}°C</b></span>
      <span>${T.humidity} <b>${c.relative_humidity_2m}%</b></span>
      <span>${T.wind} <b>${Math.round(c.wind_speed_10m)} km/h</b></span>
      ${rain != null ? `<span>${T.rain} <b>${rain}%</b></span>` : ""}
    </div>
    <div class="days">${days}</div>`;
}

// ---------- 时区工具 ----------
function offsetMinutes(tz, date) {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: tz, hourCycle: "h23",
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit",
  }).formatToParts(date).reduce((a, p) => (a[p.type] = p.value, a), {});
  const asUTC = Date.UTC(+parts.year, parts.month - 1, +parts.day, +parts.hour, +parts.minute, +parts.second);
  return Math.round((asUTC - Math.floor(date.getTime() / 1000) * 1000) / 60000);
}
function fmtOffset(min) {
  const s = min >= 0 ? "+" : "-";
  const a = Math.abs(min);
  return `${s}${String(Math.floor(a / 60)).padStart(2, "0")}:${String(a % 60).padStart(2, "0")}`;
}
function fmtHours(min) { return T.hours(Math.floor(min / 60), min % 60); }
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

// ---------- 启动 ----------
setLang(lang);
show(PRESETS[0]);
</script>
</body>
</html>
