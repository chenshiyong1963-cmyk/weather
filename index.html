<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世界天气时钟</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #fffdf8;
    --ink: #1f2328;
    --muted: #6b6f76;
    --line: #e3ddd0;
    --accent: #c2410c;
    --accent-soft: #fde7d9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a;
      --card: #1e2125;
      --ink: #eceae6;
      --muted: #9aa0a6;
      --line: #2d3136;
      --accent: #fb923c;
      --accent-soft: #3a2518;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 680px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; letter-spacing: .02em; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }

  .search { position: relative; }
  .search input {
    width: 100%;
    font-size: 1.05rem;
    padding: 14px 16px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    color: var(--ink);
    outline: none;
  }
  .search input:focus { border-color: var(--accent); }
  .results {
    position: absolute; z-index: 10; left: 0; right: 0; top: calc(100% + 6px);
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    list-style: none; margin: 0; padding: 6px; display: none;
    box-shadow: 0 10px 30px rgba(0,0,0,.12);
    max-height: 320px; overflow-y: auto;
  }
  .results.show { display: block; }
  .results li { padding: 10px 12px; border-radius: 8px; cursor: pointer; }
  .results li:hover, .results li.active { background: var(--accent-soft); }
  .results .meta { color: var(--muted); font-size: .85rem; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 24px; }
  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: 6px 12px; border-radius: 999px; font-size: .9rem; cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 22px;
  }
  .place { font-size: 1.35rem; font-weight: 600; margin: 0; }
  .place-meta { color: var(--muted); font-size: .9rem; margin: 2px 0 18px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
  .block { border-top: 1px solid var(--line); padding-top: 12px; }
  .label { color: var(--muted); font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; }
  .clock { font-size: 2.4rem; font-weight: 600; font-variant-numeric: tabular-nums; margin: 2px 0 0; }
  .date { color: var(--muted); }
  .tz { font-size: 1.05rem; margin-top: 4px; word-break: break-all; }
  .diff { color: var(--accent); font-size: .9rem; }

  .now { display: flex; align-items: center; gap: 14px; margin-top: 4px; }
  .icon { font-size: 3rem; line-height: 1; }
  .temp { font-size: 2.4rem; font-weight: 600; }
  .desc { color: var(--muted); }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: .92rem; }
  .facts span b { font-weight: 600; }

  .days { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 18px; text-align: center; }
  .day { background: var(--bg); border-radius: 10px; padding: 10px 4px; font-size: .85rem; }
  .day .i { font-size: 1.4rem; }
  .day .hi { font-weight: 600; }
  .day .lo { color: var(--muted); }

  .status { color: var(--muted); text-align: center; padding: 30px 0; }
  .err { color: #dc2626; }
  footer { color: var(--muted); font-size: .8rem; margin-top: 28px; text-align: center; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>世界天气时钟</h1>
  <p class="sub">搜索或选择任意城市，查看当地时区、当地时间和天气。</p>

  <div class="search">
    <input id="q" type="search" placeholder="输入城市名，例如：东京、Paris、New York" autocomplete="off">
    <ul id="results" class="results"></ul>
  </div>

  <div class="chips" id="chips"></div>

  <section id="out" class="card">
    <div class="status">请选择一个城市</div>
  </section>

  <footer>天气与城市数据：<a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>（免费，无需 API Key）</footer>
</main>

<script>
const PRESETS = [
  { name: "东京", country: "日本", latitude: 35.6895, longitude: 139.6917, timezone: "Asia/Tokyo" },
  { name: "北京", country: "中国", latitude: 39.9075, longitude: 116.3972, timezone: "Asia/Shanghai" },
  { name: "上海", country: "中国", latitude: 31.2222, longitude: 121.4581, timezone: "Asia/Shanghai" },
  { name: "首尔", country: "韩国", latitude: 37.5660, longitude: 126.9784, timezone: "Asia/Seoul" },
  { name: "新加坡", country: "新加坡", latitude: 1.2897, longitude: 103.8501, timezone: "Asia/Singapore" },
  { name: "伦敦", country: "英国", latitude: 51.5085, longitude: -0.1257, timezone: "Europe/London" },
  { name: "巴黎", country: "法国", latitude: 48.8534, longitude: 2.3488, timezone: "Europe/Paris" },
  { name: "纽约", country: "美国", latitude: 40.7143, longitude: -74.0060, timezone: "America/New_York" },
  { name: "洛杉矶", country: "美国", latitude: 34.0522, longitude: -118.2437, timezone: "America/Los_Angeles" },
  { name: "悉尼", country: "澳大利亚", latitude: -33.8679, longitude: 151.2073, timezone: "Australia/Sydney" },
];

// WMO weather codes → 中文描述 + 图标
const WMO = {
  0: ["晴", "☀️", "🌙"], 1: ["大致晴朗", "🌤️", "🌙"], 2: ["局部多云", "⛅", "☁️"], 3: ["阴", "☁️", "☁️"],
  45: ["雾", "🌫️"], 48: ["冻雾", "🌫️"],
  51: ["小毛毛雨", "🌦️"], 53: ["毛毛雨", "🌦️"], 55: ["大毛毛雨", "🌧️"],
  56: ["冻毛毛雨", "🌧️"], 57: ["强冻毛毛雨", "🌧️"],
  61: ["小雨", "🌦️"], 63: ["中雨", "🌧️"], 65: ["大雨", "🌧️"],
  66: ["冻雨", "🌧️"], 67: ["强冻雨", "🌧️"],
  71: ["小雪", "🌨️"], 73: ["中雪", "🌨️"], 75: ["大雪", "❄️"], 77: ["雪粒", "🌨️"],
  80: ["小阵雨", "🌦️"], 81: ["阵雨", "🌧️"], 82: ["强阵雨", "⛈️"],
  85: ["小阵雪", "🌨️"], 86: ["大阵雪", "❄️"],
  95: ["雷暴", "⛈️"], 96: ["雷暴伴小冰雹", "⛈️"], 99: ["雷暴伴大冰雹", "⛈️"],
};
function wmo(code, isDay = 1) {
  const w = WMO[code] || ["未知", "❔"];
  return { text: w[0], icon: (!isDay && w[2]) ? w[2] : w[1] };
}

const $ = (id) => document.getElementById(id);
const out = $("out");
const input = $("q");
const list = $("results");
let clockTimer = null;
let searchTimer = null;
let searchSeq = 0;
let current = [];
let activeIdx = -1;

// ---- 预设城市 ----
PRESETS.forEach((p) => {
  const b = document.createElement("button");
  b.className = "chip";
  b.textContent = p.name;
  b.onclick = () => show(p);
  $("chips").appendChild(b);
});

// ---- 搜索 ----
input.addEventListener("input", () => {
  clearTimeout(searchTimer);
  const q = input.value.trim();
  if (q.length < 1) { hideResults(); return; }
  searchTimer = setTimeout(() => search(q), 300);
});
input.addEventListener("keydown", (e) => {
  if (!list.classList.contains("show")) return;
  if (e.key === "ArrowDown") { e.preventDefault(); setActive(activeIdx + 1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); setActive(activeIdx - 1); }
  else if (e.key === "Enter") { e.preventDefault(); pick(activeIdx >= 0 ? activeIdx : 0); }
  else if (e.key === "Escape") { hideResults(); }
});
document.addEventListener("click", (e) => {
  if (!e.target.closest(".search")) hideResults();
});

async function search(q) {
  const seq = ++searchSeq;
  const lang = /[぀-ヿ]/.test(q) ? "ja" : "zh";
  const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=${lang}&format=json`;
  try {
    const r = await fetch(url);
    const data = await r.json();
    if (seq !== searchSeq) return;
    current = data.results || [];
    renderResults();
  } catch {
    if (seq !== searchSeq) return;
    list.innerHTML = `<li class="err">搜索失败，请检查网络</li>`;
    list.classList.add("show");
  }
}

function renderResults() {
  activeIdx = -1;
  if (!current.length) {
    list.innerHTML = `<li class="meta">没有找到匹配的城市</li>`;
  } else {
    list.innerHTML = current.map((c, i) => {
      const region = [c.admin1, c.country].filter(Boolean).join("，");
      return `<li data-i="${i}"><div>${esc(c.name)}</div><div class="meta">${esc(region)} · ${esc(c.timezone || "")}</div></li>`;
    }).join("");
    list.querySelectorAll("li[data-i]").forEach((li) => {
      li.onclick = () => pick(+li.dataset.i);
    });
  }
  list.classList.add("show");
}
function setActive(i) {
  const items = list.querySelectorAll("li[data-i]");
  if (!items.length) return;
  activeIdx = (i + items.length) % items.length;
  items.forEach((el, k) => el.classList.toggle("active", k === activeIdx));
  items[activeIdx].scrollIntoView({ block: "nearest" });
}
function pick(i) {
  const c = current[i];
  if (!c) return;
  hideResults();
  input.value = c.name;
  show(c);
}
function hideResults() { list.classList.remove("show"); }

// ---- 显示城市 ----
async function show(city) {
  clearInterval(clockTimer);
  const tz = city.timezone;
  const region = [city.admin1, city.country].filter(Boolean).join("，");

  out.innerHTML = `
    <p class="place">${esc(city.name)}</p>
    <p class="place-meta">${esc(region)} · ${city.latitude.toFixed(2)}°, ${city.longitude.toFixed(2)}°</p>
    <div class="grid">
      <div class="block">
        <div class="label">当地时间</div>
        <div class="clock" id="clock">--:--:--</div>
        <div class="date" id="date"></div>
      </div>
      <div class="block">
        <div class="label">时区</div>
        <div class="tz">${esc(tz)}</div>
        <div class="tz" id="offset"></div>
        <div class="diff" id="diff"></div>
      </div>
    </div>
    <div class="block" style="margin-top:14px">
      <div class="label">当地天气</div>
      <div id="wx" class="status" style="padding:16px 0">正在获取天气…</div>
    </div>`;

  const tick = () => {
    const now = new Date();
    $("clock").textContent = new Intl.DateTimeFormat("zh-CN", {
      timeZone: tz, hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false,
    }).format(now);
    $("date").textContent = new Intl.DateTimeFormat("zh-CN", {
      timeZone: tz, year: "numeric", month: "long", day: "numeric", weekday: "long",
    }).format(now);
    const off = offsetMinutes(tz, now);
    $("offset").textContent = "UTC" + fmtOffset(off);
    const mine = -now.getTimezoneOffset();
    const d = off - mine;
    $("diff").textContent = d === 0 ? "与你所在时区相同" :
      `比你的时间${d > 0 ? "快" : "慢"} ${fmtHours(Math.abs(d))}`;
  };
  tick();
  clockTimer = setInterval(tick, 1000);

  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.latitude}&longitude=${city.longitude}` +
      `&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m` +
      `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max` +
      `&timezone=${encodeURIComponent(tz || "auto")}&forecast_days=5`;
    const r = await fetch(url);
    const d = await r.json();
    if (!r.ok) throw new Error(d.reason || r.status);
    renderWeather(d, tz);
  } catch (e) {
    const wx = $("wx");
    if (wx) wx.innerHTML = `<span class="err">天气获取失败：${esc(String(e.message || e))}</span>`;
  }
}

function renderWeather(d, tz) {
  const c = d.current;
  const w = wmo(c.weather_code, c.is_day);
  const days = d.daily.time.map((t, i) => {
    const dw = wmo(d.daily.weather_code[i]);
    const label = i === 0 ? "今天" : new Intl.DateTimeFormat("zh-CN", { weekday: "short", timeZone: "UTC" })
      .format(new Date(t + "T12:00:00Z"));
    return `<div class="day">
      <div>${label}</div>
      <div class="i" title="${dw.text}">${dw.icon}</div>
      <div class="hi">${Math.round(d.daily.temperature_2m_max[i])}°</div>
      <div class="lo">${Math.round(d.daily.temperature_2m_min[i])}°</div>
    </div>`;
  }).join("");
  const rain = d.daily.precipitation_probability_max?.[0];

  $("wx").outerHTML = `
    <div class="now">
      <div class="icon">${w.icon}</div>
      <div>
        <div class="temp">${Math.round(c.temperature_2m)}°C</div>
        <div class="desc">${w.text}</div>
      </div>
    </div>
    <div class="facts">
      <span>体感 <b>${Math.round(c.apparent_temperature)}°C</b></span>
      <span>湿度 <b>${c.relative_humidity_2m}%</b></span>
      <span>风速 <b>${Math.round(c.wind_speed_10m)} km/h</b></span>
      ${rain != null ? `<span>今日降水概率 <b>${rain}%</b></span>` : ""}
    </div>
    <div class="days">${days}</div>`;
}

// ---- 时区工具 ----
function offsetMinutes(tz, date) {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: tz, hourCycle: "h23",
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit",
  }).formatToParts(date).reduce((a, p) => (a[p.type] = p.value, a), {});
  const asUTC = Date.UTC(+parts.year, parts.month - 1, +parts.day, +parts.hour, +parts.minute, +parts.second);
  return Math.round((asUTC - Math.floor(date.getTime() / 1000) * 1000) / 60000);
}
function fmtOffset(min) {
  const s = min >= 0 ? "+" : "-";
  const a = Math.abs(min);
  return `${s}${String(Math.floor(a / 60)).padStart(2, "0")}:${String(a % 60).padStart(2, "0")}`;
}
function fmtHours(min) {
  const h = Math.floor(min / 60), m = min % 60;
  return m ? `${h} 小时 ${m} 分钟` : `${h} 小时`;
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

// 默认显示东京
show(PRESETS[0]);
</script>
</body>
</html>
